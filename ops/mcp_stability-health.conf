# Netdata health rules for the compact MCP overview.
# Alerts are visible in Netdata only; external notifications remain disabled.

    alarm: mcp_oracle_connector_down
       on: mcp_stability.health
    class: Errors
     type: MCP
component: Connector
     calc: $oracle
    units: status
    every: 30s
     crit: $this < 1
  summary: Oracle MCP connector is unavailable
     info: Codex MCP, public endpoint, or admin runtime health is unavailable
       to: silent

    alarm: mcp_context_engine_down
       on: mcp_stability.health
    class: Errors
     type: MCP
component: Context Engine
     calc: $context_engine
    units: status
    every: 30s
     crit: $this < 1
  summary: MCP Context Engine service is down
     info: context-engine.service is not active
       to: silent

    alarm: mcp_jxser_standard_down
       on: mcp_stability.health
    class: Errors
     type: MCP
component: Connector
     calc: $jxser_standard
    units: status
    every: 30s
     crit: $this < 1
  summary: jxser_standard connector is disconnected
     info: Enabled jxser_standard Context Engine upstream is not connected
       to: silent

    alarm: mcp_jxnative_down
       on: mcp_stability.health
    class: Errors
     type: MCP
component: Connector
     calc: $jxnative
    units: status
    every: 30s
     crit: $this < 1
  summary: jxnative connector is disconnected
     info: Enabled jxnative Context Engine upstream is not connected
       to: silent

    alarm: mcp_session_pressure
       on: mcp_stability.session_pressure
    class: Utilization
     type: MCP
component: Sessions
     calc: $pressure
    units: %
    every: 30s
     warn: $this >= 75
     crit: $this >= 90
  summary: MCP session pool pressure is high
     info: Active MCP sessions are approaching the configured session limit
       to: silent

    alarm: mcp_session_cap_eviction
       on: mcp_stability.events
    class: Errors
     type: MCP
component: Sessions
     calc: $cap_evictions
    units: events
    every: 30s
     crit: $this > 0
  summary: MCP session cap eviction detected
     info: At least one session was evicted because the session pool reached its limit during the last 65 seconds
       to: silent

    alarm: mcp_tool_errors
       on: mcp_stability.events
    class: Errors
     type: MCP
component: Tools
     calc: $tool_errors
    units: errors
    every: 30s
     warn: $this > 0
  summary: MCP tool errors detected
     info: One or more Oracle MCP tool calls failed during the last 5 minutes
       to: silent

    alarm: mcp_tool_timeouts
       on: mcp_stability.events
    class: Errors
     type: MCP
component: Tools
     calc: $tool_timeouts
    units: timeouts
    every: 30s
     crit: $this > 0
  summary: MCP tool timeout detected
     info: At least one Oracle MCP tool call timed out during the last 5 minutes
       to: silent

    alarm: mcp_oracle_tool_latency_high
       on: mcp_stability.latency
    class: Latency
     type: MCP
component: Connector
     calc: $oracle
    units: ms
    every: 30s
     warn: $this > 15000
     crit: $this > 30000
  summary: Oracle MCP tool latency is high
     info: p95 tool-call latency over the last 5 minutes is elevated
       to: silent

    alarm: mcp_jxser_latency_high
       on: mcp_stability.latency
    class: Latency
     type: MCP
component: Connector
     calc: $jxser_standard
    units: ms
    every: 30s
     warn: $this > 10000
     crit: $this > 20000
  summary: jxser_standard connector latency is high
     info: p95 observed retrieval latency over the last 5 minutes is elevated
       to: silent

    alarm: mcp_jxnative_latency_high
       on: mcp_stability.latency
    class: Latency
     type: MCP
component: Connector
     calc: $jxnative
    units: ms
    every: 30s
     warn: $this > 10000
     crit: $this > 20000
  summary: jxnative connector latency is high
     info: p95 observed retrieval latency over the last 5 minutes is elevated
       to: silent
